name: Check retired branding
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit source, bundles, encoded strings and archives
        run: node scripts/audit-retired-brand.cjs
